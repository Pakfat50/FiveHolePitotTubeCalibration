  <path class="edge" d="M600 1125 V1185"/>
  <path class="edge" d="M600 1265 V1325"/>
  <path class="edge" d="M600 1405 V1465"/>
  <path class="edge" d="M600 1545 V1605"/>
  <path class="edge" d="M600 1685 V1745"/>
  <path class="edge" d="M480 245 C310 245 220 285 220 345"/>
  <path class="edge" d="M720 245 C890 245 980 285 980 345"/>
  <path class="edge" d="M220 425 C220 510 310 545 480 545"/>
  <path class="edge" d="M980 425 C980 510 890 545 720 545"/>
  <path class="edge" d="M420 665 C300 665 220 705 220 765"/>
  <path class="edge" d="M780 665 C900 665 980 705 980 765"/>
  <path class="edge" d="M220 845 C220 940 320 965 480 965"/>
  <path class="edge" d="M980 845 C980 940 880 965 720 965"/>
  <path class="edge" d="M480 1225 C330 1225 220 1280 220 1325"/>
  <path class="edge" d="M720 1225 C870 1225 980 1280 980 1325"/>
  <path class="edge" d="M480 1505 C300 1505 220 1550 220 1605"/>
  <path class="edge" d="M720 1505 C900 1505 980 1550 980 1605"/>
  <path class="edge" d="M720 1785 H980"/>

  <!-- nodes -->
  <rect class="node external" x="430" y="65" width="340" height="80"/>
  <text class="label" x="600" y="114">GUI Raw Input</text>

  <rect class="node module" x="430" y="205" width="340" height="80"/>
  <text class="label" x="600" y="254">CalibrationController</text>

  <rect class="node data" x="430" y="345" width="340" height="80"/>
  <text class="label" x="600" y="394">CalibrationSettings</text>

  <rect class="node module" x="430" y="485" width="340" height="80"/>
