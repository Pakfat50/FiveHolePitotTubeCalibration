<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1880" viewBox="0 0 1200 1880" role="img" aria-labelledby="title desc">
  <title id="title">ソフトウェア内部データフロー</title>
  <desc id="desc">GUI入力から較正計画、シミュレーション、Gコード生成までのデータフロー</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,3 L0,6 Z" fill="#334155"/>
    </marker>
    <style>
      .node { stroke-width: 3; rx: 12; }
      .module { fill: #dbeafe; stroke: #2563eb; }
      .data { fill: #dcfce7; stroke: #16a34a; }
      .external { fill: #ffedd5; stroke: #ea580c; }
      .label { font: 600 21px "Noto Sans JP", "Yu Gothic", sans-serif; fill: #111827; text-anchor: middle; }
      .sub { font: 17px "Noto Sans JP", "Yu Gothic", sans-serif; fill: #111827; text-anchor: middle; }
      .edge { stroke: #334155; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="1880" fill="#ffffff"/>
  <text x="600" y="42" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="28" font-weight="700" fill="#111827">ソフトウェア内部データフロー</text>

  <!-- edges -->
  <path class="edge" d="M600 145 V205"/>
  <path class="edge" d="M600 285 V345"/>
  <path class="edge" d="M600 425 V485"/>
  <path class="edge" d="M600 565 V625"/>
  <path class="edge" d="M600 705 V765"/>
