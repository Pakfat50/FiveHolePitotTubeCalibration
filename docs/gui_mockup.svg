  <line x1="50" y1="155" x2="470" y2="155" stroke="#d4dbe3"/>
  <text x="50" y="190" fill="#2d3748" font-size="18" font-family="sans-serif" font-weight="bold">較正対象角度</text>
  <g font-family="Arial,sans-serif" font-size="16" fill="#374151">
    <text x="55" y="225">AoA range [deg]</text><rect x="260" y="207" width="75" height="30" fill="#fff" stroke="#aab5c2"/><text x="278" y="228">-20</text><text x="345" y="228">to</text><rect x="370" y="207" width="75" height="30" fill="#fff" stroke="#aab5c2"/><text x="389" y="228">20</text>
    <text x="55" y="270">AoS range [deg]</text><rect x="260" y="252" width="75" height="30" fill="#fff" stroke="#aab5c2"/><text x="278" y="273">-10</text><text x="345" y="273">to</text><rect x="370" y="252" width="75" height="30" fill="#fff" stroke="#aab5c2"/><text x="389" y="273">10</text>
    <text x="55" y="315">AoA points</text><rect x="260" y="297" width="75" height="30" fill="#fff" stroke="#aab5c2"/><text x="291" y="318">20</text>
    <text x="55" y="360">AoS points</text><rect x="260" y="342" width="75" height="30" fill="#fff" stroke="#aab5c2"/><text x="291" y="363">10</text>
