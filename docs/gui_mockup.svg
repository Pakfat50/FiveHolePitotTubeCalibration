<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <rect width="1600" height="1000" fill="#eef1f5"/>
  <rect x="25" y="20" width="1550" height="60" rx="8" fill="#26364a"/>
  <text x="55" y="58" fill="white" font-size="28" font-family="sans-serif" font-weight="bold">5孔ピトー管 較正Gコード生成ソフト</text>
  <text x="1320" y="57" fill="#c9d6e5" font-size="18" font-family="sans-serif">Windows 11 / GRBL Mega-5X</text>

