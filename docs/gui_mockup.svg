  <text x="50" y="410" fill="#2d3748" font-size="18" font-family="sans-serif" font-weight="bold">寸法 [mm]</text>
  <g font-family="Arial,sans-serif" font-size="16" fill="#374151">
    <text x="55" y="445">Pitch center → tip, X</text><rect x="300" y="427" width="145" height="30" fill="#fff" stroke="#aab5c2"/><text x="360" y="448">200</text>
