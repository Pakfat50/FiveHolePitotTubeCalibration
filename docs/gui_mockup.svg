    <rect x="55" y="900" width="19" height="19" fill="#2d72c8"/><text x="84" y="916">Gコードにコメントを付加</text>
    <rect x="245" y="830" width="19" height="19" fill="#2d72c8"/><text x="274" y="846">正確なAoA/AoSで較正</text>
    <rect x="245" y="865" width="19" height="19" fill="#e2a329"/><text x="274" y="881">非正確モード：実AoA/AoSを表示</text>
