    <circle cx="650" cy="610" r="7"/><circle cx="705" cy="610" r="7"/><circle cx="760" cy="610" r="7"/><circle cx="815" cy="610" r="7"/><circle cx="870" cy="610" r="7"/><circle cx="925" cy="610" r="7"/><circle cx="980" cy="610" r="7"/><circle cx="1035" cy="610" r="7"/><circle cx="1090" cy="610" r="7"/><circle cx="1145" cy="610" r="7"/>
    <circle cx="650" cy="540" r="7"/><circle cx="705" cy="540" r="7"/><circle cx="760" cy="540" r="7"/><circle cx="815" cy="540" r="7"/><circle cx="870" cy="540" r="7"/><circle cx="925" cy="540" r="7"/><circle cx="980" cy="540" r="7"/><circle cx="1035" cy="540" r="7"/><circle cx="1090" cy="540" r="7"/><circle cx="1145" cy="540" r="7"/>
