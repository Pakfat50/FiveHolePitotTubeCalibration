  <rect x="565" y="175" width="640" height="520" fill="#fbfcfe" stroke="#c8d0da"/>
  <line x1="885" y1="190" x2="885" y2="680" stroke="#9aa8b8"/><line x1="580" y1="435" x2="1190" y2="435" stroke="#9aa8b8"/>
  <text x="1180" y="460" fill="#374151" font-size="17" font-family="Arial,sans-serif">AoS [deg]</text><text x="835" y="200" fill="#374151" font-size="17" font-family="Arial,sans-serif">AoA [deg]</text>
