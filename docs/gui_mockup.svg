  </g>
  <text x="50" y="540" fill="#2d3748" font-size="18" font-family="sans-serif" font-weight="bold">移動条件</text>
  <g font-family="Arial,sans-serif" font-size="16" fill="#374151">
    <text x="55" y="575">Hold time [s]</text><rect x="300" y="557" width="145" height="30" fill="#fff" stroke="#aab5c2"/><text x="360" y="578">3.0</text>
    <text x="55" y="620">X speed [mm/s]</text><rect x="300" y="602" width="145" height="30" fill="#fff" stroke="#aab5c2"/><text x="360" y="623">20</text>
    <text x="55" y="665">Y speed [mm/s]</text><rect x="300" y="647" width="145" height="30" fill="#fff" stroke="#aab5c2"/><text x="360" y="668">20</text>
    <text x="55" y="710">Z speed [deg/s]</text><rect x="300" y="692" width="145" height="30" fill="#fff" stroke="#aab5c2"/><text x="360" y="713">10</text>
    <text x="55" y="755">A speed [deg/s]</text><rect x="300" y="737" width="145" height="30" fill="#fff" stroke="#aab5c2"/><text x="360" y="758">10</text>
  </g>
  <text x="50" y="810" fill="#2d3748" font-size="18" font-family="sans-serif" font-weight="bold">オプション</text>
