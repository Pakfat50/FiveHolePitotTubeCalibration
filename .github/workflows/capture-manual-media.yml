name: Capture user manual media

on:
  workflow_dispatch:
  push:
    branches:
      - feature/user-manual

permissions:
  contents: write

jobs:
  capture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb python3-tk fonts-noto-cjk

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy matplotlib pillow

      - name: Capture running GUI
        env:
          MPLBACKEND: TkAgg
        run: xvfb-run --server-args="-screen 0 1600x1200x24" python tools/capture_manual_media.py

      - name: Commit generated media
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/media
          git diff --cached --quiet || git commit -m "docs: add screenshots and getting-started GIF"
          git push
